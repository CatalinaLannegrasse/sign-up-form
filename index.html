<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page-container">
        <!-- LEFT SIDE: Image and Logo -->
        <div class="image-container">
            <div class="logo-box">
                <!-- Replace with your actual logo image path -->
                <img src="odin-logo.png" alt="Odin Logo"> 
                <span>ODIN</span>
            </div>
            <div class="credit">
                Photo by <a href="https://unsplash.com/@haliewestphoto" target="_blank">Halie West</a> on Unsplash
            </div>
        </div>

        <!-- RIGHT SIDE: Content and Form -->
        <div class="form-container">
            
            <!-- Top Hook Section -->
            <div class="info-header">
                <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up now to get started.</p>
                <p class="call-to-action">You know you want to.</p>
            </div>

            <!-- Form Section -->
            <form action="#" method="get">
                <h2>Let's do this!</h2>
                
                <div class="form-inputs">
                    <!-- First Name / Last Name -->
                    <div class="form-row">
                        <label for="first-name">FIRST NAME</label>
                        <input type="text" id="first-name" name="first_name">
                    </div>
                    <div class="form-row">
                        <label for="last-name">LAST NAME</label>
                        <input type="text" id="last-name" name="last_name">
                    </div>

                    <!-- Email / Phone Number -->
                    <div class="form-row">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email" placeholder="example@mail.com">
                    </div>
                    <div class="form-row">
                        <label for="phone">PHONE NUMBER</label>
                        <input type="tel" id="phone" name="phone" pattern="[0-9]{2} [0-9]{4}-[0-9]{4}" placeholder="11 3456-7890">
                    </div>

                    <!-- Password / Confirm Password -->
                    <div class="form-row">
                        <div class="label-container">
                            <label for="password">PASSWORD</label>
                            <span class="help-text">Must be at least 8 characters</span>
                        </div>
                        <input type="password" id="password" name="password" minlength="8" required>
                    </div>

                    <div class="form-row">
                        <label for="confirm-password">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm-password" name="confirm_password" minlength="8" required>
                    </div>
                </div>
            </form>

            <!-- Bottom Button & Login Section -->
            <div class="form-footer">
                <button type="submit">Create Account</button>
                <p>Already have an account? <a href="#">Log in</a></p>
            </div>

        </div>
    </div>

</body>
</html>
